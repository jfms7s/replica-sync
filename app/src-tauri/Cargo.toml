[package]
name = "replica-sync-app"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
name = "replica_sync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
replica-sync-app-state = { path = "../../crates/app-state" }
replica-sync-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
