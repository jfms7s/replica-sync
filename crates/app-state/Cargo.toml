[package]
name = "replica-sync-app-state"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "app_state"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
replica-sync-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
