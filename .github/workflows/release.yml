name: release
on:
  push:
    tags: ["v*"]

# Nothing by default; only the jobs that create or fill the draft release get
# a write token.
permissions: {}

jobs:
  # One job creates the draft, so the two build jobs never race to create two.
  draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The tag matches the version in every manifest
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error file=$1::$1 says version '$2' but the tag is $GITHUB_REF_NAME"
              fail=1
            fi
          }
          check Cargo.toml "$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          check app/package.json "$(jq -r .version app/package.json)"
          check app/src-tauri/tauri.conf.json "$(jq -r .version app/src-tauri/tauri.conf.json)"
          if ! grep -qx 'version.workspace = true' app/src-tauri/Cargo.toml; then
            check app/src-tauri/Cargo.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -n 1)"
          fi
          exit "$fail"
      - name: Create the draft release (or reuse one a re-run made)
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: "Installers for Windows (.msi, setup .exe) and Linux (.AppImage, .deb). The Windows installers are unsigned: in SmartScreen choose More info → Run anyway. See the README."
        run: |
          # A draft has no tag yet, so look it up in the list (a re-run reuses it).
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")"
          id="${existing%%$'\n'*}"
          if [ -z "$id" ]; then
            # Take the id from the create call itself: a new draft can take a
            # moment to show up in the list.
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="replica-sync $GITHUB_REF_NAME" \
              -f body="$NOTES" -F draft=true -F prerelease=false --jq .id)"
          fi
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 keeps the AppImage/.deb compatible with older glibc.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Its own cache space: a release never restores a cache another run wrote.
          prefix-key: v0-release
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # Upload into the draft the `draft` job made; never create one here.
          releaseId: ${{ needs.draft.outputs.release_id }}
      # The test CLI, for the manual exFAT drive-id check (`replica-sync-cli volume E:\`).
      - name: Attach the CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --locked -p replica-sync-cli
          gh release upload "${{ github.ref_name }}" target/release/replica-sync-cli.exe --clobber

  # SHA256SUMS.txt over every file in the draft, once all of them are there.
  checksums:
    needs: [draft, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Attach SHA256SUMS.txt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
