name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
        if: runner.os != 'Linux'
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Test with coverage (eng-metrics-lab)
        if: runner.os == 'Linux'
        run: |
          cargo llvm-cov --workspace --no-fail-fast --lcov --output-path "$RUNNER_TEMP/coverage-rust.lcov"
          mkdir -p .quality
          mv "$RUNNER_TEMP/coverage-rust.lcov" .quality/coverage-rust.lcov
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: coverage-fragments
          path: .quality/coverage-rust.lcov
          include-hidden-files: true
          retention-days: 7

  ui:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test with coverage (eng-metrics-lab)
        run: |
          npx vitest run --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcovonly --coverage.reportsDirectory="$RUNNER_TEMP/coverage-ts" '--coverage.include=src/**'
          mkdir -p ../.quality
          sed 's|^SF:\([^/]\)|SF:app/\1|' "$RUNNER_TEMP/coverage-ts/lcov.info" > "$RUNNER_TEMP/coverage-ts.lcov"
          mv "$RUNNER_TEMP/coverage-ts.lcov" ../.quality/coverage-ts.lcov
      - run: npm run i18n:check
      - name: Dead code (knip, eng-metrics-lab)
        if: ${{ !cancelled() }}
        run: mkdir -p ../.quality && npx knip --reporter json --no-exit-code > ../.quality/deadcode-ts.json
        continue-on-error: true
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-fragments
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        if: ${{ !cancelled() }}
        uses: jfms7s/eng-metrics-lab/action@v0
        continue-on-error: true

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
        working-directory: app
      - run: cargo fmt --check
        working-directory: app/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri
      - run: npx tauri build --debug --no-bundle
        working-directory: app
