name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only pushes to main write the cache, so a PR cannot poison it.
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --all --check
      # The app crate needs WebKit; the `app` job builds and lints it.
      - run: cargo clippy --workspace --exclude replica-sync-app --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude replica-sync-app --no-fail-fast --locked
        if: runner.os != 'Linux'
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Test with coverage (eng-metrics-lab)
        if: runner.os == 'Linux'
        run: |
          cargo llvm-cov --workspace --exclude replica-sync-app --no-fail-fast --locked --lcov --output-path "$RUNNER_TEMP/coverage-rust.lcov"
          mkdir -p .quality
          mv "$RUNNER_TEMP/coverage-rust.lcov" .quality/coverage-rust.lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: coverage-fragments
          path: .quality/coverage-rust.lcov
          include-hidden-files: true
          retention-days: 7

  ui:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test with coverage (eng-metrics-lab)
        run: |
          npx vitest run --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcovonly --coverage.reportsDirectory="$RUNNER_TEMP/coverage-ts" '--coverage.include=src/**'
          mkdir -p ../.quality
          sed 's|^SF:\([^/]\)|SF:app/\1|' "$RUNNER_TEMP/coverage-ts/lcov.info" > "$RUNNER_TEMP/coverage-ts.lcov"
          mv "$RUNNER_TEMP/coverage-ts.lcov" ../.quality/coverage-ts.lcov
      - run: npm run i18n:check
      - name: Dead code (knip, eng-metrics-lab)
        if: ${{ !cancelled() }}
        run: mkdir -p ../.quality && npx knip --reporter json --no-exit-code > ../.quality/deadcode-ts.json
        continue-on-error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-fragments
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        if: ${{ !cancelled() }}
        uses: jfms7s/eng-metrics-lab/action@961b196f18ec58c1fc42cdd0e7e000094a39f545 # v0.4.0
        continue-on-error: true

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: npm ci
        working-directory: app
      - run: cargo fmt --all --check
      - run: cargo clippy -p replica-sync-app --all-targets --locked -- -D warnings
      - run: npx tauri build --debug --no-bundle
        working-directory: app
