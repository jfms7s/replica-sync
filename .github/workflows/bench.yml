name: bench
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-diff-1m:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p replica-sync-cli
      - name: 1M files, both sides identical (target < 120 s on SSD; runner disks vary)
        shell: bash
        run: |
          BIN=./target/release/replica-sync-cli
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          $BIN gen-tree "$RUNNER_TEMP/src" --files 1000000 --large 0
          # A copy keeps names, contents and modified times, and is faster than a second gen-tree.
          cp -a "$RUNNER_TEMP/src" "$RUNNER_TEMP/rep"
          echo "### ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          OUT=$($BIN plan "$RUNNER_TEMP/src" "$RUNNER_TEMP/rep" --summary)
          echo "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          # Timing is reported, not gated; a non-empty plan on identical trees is a bug.
          if ! echo "$OUT" | grep -q "0 create, 0 update, 0 move, 0 delete, 0 folders"; then
            echo "::error::identical trees gave a non-empty plan"
            exit 1
          fi
